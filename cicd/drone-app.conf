# MANAGED BY MANUAL CONFIG
server {
    listen 80;
    server_name dronepilotapp.psi.ncsu.edu;
    
    # Access and error logs
    access_log /var/log/nginx/dronepilotapp.psi.ncsu.edu.access.log;
    error_log /var/log/nginx/dronepilotapp.psi.ncsu.edu.error.log;

    # Proxy to the frontend Docker container
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API endpoints - proxy directly to the API container
    location ~ ^/(ping|flight-list|set-grid/.*) {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    
    # File server - proxy to the file server container
    location /data/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}