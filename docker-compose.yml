version: '3.8'

services:
  backend:
    build: .
    container_name: drone_backend
    ports:
      - "5000:5000"
    environment:
      FLASK_APP: app.py
      FLASK_RUN_HOST: 0.0.0.0
      FLASK_ENV: development
      LOG_FILE: /app/logs/app.log
    volumes:
      - .:/app
      - ../../Downloads/dev_data/data:/data
    command: flask run --host=0.0.0.0 --port=5000
